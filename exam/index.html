<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校內考試學生工具 | Assessments</title>
  <style>
    :root { color-scheme: light; --ink: #16324f; --muted: #5e7185; --line: #d7e0e8; --blue: #1769aa; --soft: #eef6fc; --pending: #fff8e1; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f8fb; color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; line-height: 1.6; }
    a { color: var(--blue); }
    .page { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 52px; }
    .topbar { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 22px; }
    .topbar a { font-weight: 700; text-decoration: none; }
    .topbar nav { display: flex; flex-wrap: wrap; gap: 14px; font-size: .94rem; }
    header { background: linear-gradient(135deg, #e4f2ff, #f8fbff); border: 1px solid #bfdcf2; border-radius: 18px; padding: 28px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.65rem, 4vw, 2.35rem); line-height: 1.2; }
    header p { margin: 0; color: var(--muted); max-width: 720px; }
    .notice { margin: 18px 0 0; padding: 12px 14px; border-left: 4px solid #e0a800; border-radius: 8px; background: var(--pending); color: #594a17; font-size: .94rem; }
    .section-title { margin: 30px 0 12px; font-size: 1.25rem; }
    .catalog { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .exam-card { display: flex; flex-direction: column; gap: 10px; min-height: 190px; padding: 20px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 3px 12px rgba(22, 50, 79, .06); }
    .exam-card h3 { margin: 0; font-size: 1.08rem; }
    .exam-card p { margin: 0; color: var(--muted); font-size: .94rem; }
    .exam-card .meta { color: var(--muted); font-size: .86rem; }
    .exam-card .action { margin-top: auto; display: inline-block; align-self: flex-start; padding: 9px 14px; border-radius: 8px; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none; }
    .exam-card .action:hover, .exam-card .action:focus-visible { background: #0e4e83; }
    .exam-card.pending { background: #fffdf5; border-color: #edd38a; }
    .status { display: inline-flex; align-self: flex-start; padding: 2px 8px; border-radius: 999px; background: #e5f5e9; color: #236b36; font-size: .78rem; font-weight: 700; }
    .pending .status { background: #fff0bd; color: #715714; }
    .empty, .error { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); background: #fff; }
    footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; }
    @media (max-width: 540px) { .page { width: min(100% - 22px, 960px); padding-top: 18px; } .topbar { align-items: flex-start; flex-direction: column; } header { padding: 22px 18px; } .catalog { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a href="../">← Assessments 主頁</a>
      <nav aria-label="相關工具"><a href="../hkdse/">HKDSE</a><a href="https://ai-lish.github.io/ai-learning/">舊網站首頁</a></nav>
    </div>

    <header>
      <h1>校內考試學生工具</h1>
      <p>集中管理可公開的校內數學考試學生頁面。免登入；作答內容只留在你的瀏覽器，不會上載。</p>
      <div class="notice">考試資料正在分批核對。只有標示「可作答」的試卷會提供公開入口；教師審核、OCR 寫回及未核實資產不會放在學生入口。</div>
    </header>

    <h2 class="section-title">可作答試卷</h2>
    <section id="ready-catalog" class="catalog" aria-live="polite"><div class="empty">載入考試目錄中……</div></section>

    <h2 class="section-title">待核對</h2>
    <section id="pending-catalog" class="catalog" aria-live="polite"><div class="empty">載入考試目錄中……</div></section>

    <footer>
      <div>Assessments · 學生工具維護來源</div>
      <div>目錄及公開範圍以 <a href="data/catalog.json">catalog.json</a> 為準。</div>
    </footer>
  </main>

  <script type="module">
    const ready = document.querySelector('#ready-catalog');
    const pending = document.querySelector('#pending-catalog');

    function card(entry) {
      const article = document.createElement('article');
      article.className = `exam-card ${entry.status === 'ready' ? '' : 'pending'}`;

      const status = document.createElement('span');
      status.className = 'status';
      status.textContent = entry.status === 'ready' ? '可作答' : '待核對';
      article.append(status);

      const title = document.createElement('h3');
      title.textContent = entry.label;
      article.append(title);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${entry.papers.map((paper) => paper.toUpperCase()).join('、')} · ${entry.year}`;
      article.append(meta);

      const detail = document.createElement('p');
      detail.textContent = entry.status === 'ready'
        ? '學生版試卷，開啟後可直接作答。'
        : entry.reason;
      article.append(detail);

      if (entry.status === 'ready') {
        const link = document.createElement('a');
        link.className = 'action';
        link.href = entry.studentEntry;
        link.textContent = '開啟考試 →';
        article.append(link);
      }
      return article;
    }

    function render(target, entries) {
      target.replaceChildren();
      if (!entries.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '暫時沒有項目。';
        target.append(empty);
        return;
      }
      entries.forEach((entry) => target.append(card(entry)));
    }

    try {
      const response = await fetch('data/catalog.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`目錄載入失敗（${response.status}）`);
      const catalog = await response.json();
      const entries = Array.isArray(catalog.entries) ? catalog.entries : [];
      render(ready, entries.filter((entry) => entry.status === 'ready'));
      render(pending, entries.filter((entry) => entry.status !== 'ready'));
    } catch (error) {
      const message = document.createElement('div');
      message.className = 'error';
      message.textContent = `未能載入考試目錄：${error.message}`;
      ready.replaceChildren(message);
      pending.replaceChildren();
    }
  </script>
</body>
</html>
